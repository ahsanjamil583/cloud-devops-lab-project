name: cloud-devops-lab

services:

  # ==========================================================
  # Jenkins
  # ==========================================================
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile

    image: cloud-devops-jenkins:lts
    container_name: devops-jenkins
    restart: unless-stopped

    environment:
      JENKINS_OPTS: "--prefix=/jenkins"
      PROMETHEUS_ENDPOINT: "/prometheus/"
      COLLECTING_METRICS_PERIOD_IN_SECONDS: "15"
      COLLECT_DISK_USAGE: "false"

    expose:
      - "8080"

    group_add:
      - "${DOCKER_GID}"

    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - devops-network





  # ==========================================================
  # PostgreSQL for SonarQube
  # ==========================================================
  sonar-db:
    image: postgres:16-alpine
    container_name: devops-sonar-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${SONAR_DB_NAME}
      POSTGRES_USER: ${SONAR_DB_USER}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD}

    volumes:
      - sonar_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${SONAR_DB_USER} -d ${SONAR_DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - sonar-db-network


  # ==========================================================
  # SonarQube
  # ==========================================================
  sonarqube:
    image: sonarqube:community
    container_name: devops-sonarqube
    restart: unless-stopped

    depends_on:
      sonar-db:
        condition: service_healthy

    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/${SONAR_DB_NAME}
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD}
      SONAR_WEB_CONTEXT: /sonar

    expose:
      - "9000"

    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs

    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192

    networks:
      - devops-network
      - sonar-db-network


  # ==========================================================
  # Prometheus
  # ==========================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: devops-prometheus
    restart: unless-stopped

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"

    expose:
      - "9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    networks:
      - devops-network


  # ==========================================================
  # Grafana
  # ==========================================================
  grafana:
    image: grafana/grafana:latest
    container_name: devops-grafana
    restart: unless-stopped

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: "http://localhost:8088/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"

    expose:
      - "3000"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

    networks:
      - devops-network

  # =====================================
  # Management EC2 Node Exporter
  # =====================================

  node-exporter-management:
    image: prom/node-exporter:v1.12.1
    container_name: devops-node-exporter-management
    restart: unless-stopped

    pid: host

    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"

    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave

    expose:
      - "9100"

    networks:
      - devops-network


  # ========================================================
  # Sonar Exporter
  # ========================================================
  sonar-exporter:
    build:
      context: ./sonar-exporter
      dockerfile: Dockerfile

    image: cloud-devops-sonar-exporter:phase12
    container_name: devops-sonar-exporter
    restart: unless-stopped

    depends_on:
      - sonarqube

    environment:
      SONAR_URL: "http://sonarqube:9000/sonar"
      SONAR_PROJECT_KEY: "cloud-devops-lab-app"
      SONAR_TOKEN: "${SONAR_MONITOR_TOKEN}"
      EXPORTER_PORT: "9101"

    expose:
      - "9101"

    networks:
      - devops-network


  # ==========================================================
  # Nginx
  # ==========================================================
  nginx:
    image: nginx:alpine
    container_name: devops-nginx
    restart: unless-stopped

    depends_on:
      - jenkins
      - sonarqube
      - grafana

    ports:
      - "127.0.0.1:8088:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - devops-network


# ============================================================
# Networks
# ============================================================
networks:

  devops-network:
    name: cloud-devops-network

  sonar-db-network:
    name: cloud-sonar-db-network
    internal: true


# ============================================================
# Persistent Volumes
# ============================================================
volumes:

  jenkins_home:
    name: cloud-jenkins-home

  sonar_postgres_data:
    name: cloud-sonar-postgres-data

  sonar_data:
    name: cloud-sonar-data

  sonar_extensions:
    name: cloud-sonar-extensions

  sonar_logs:
    name: cloud-sonar-logs

  prometheus_data:
    name: cloud-prometheus-data

  grafana_data:
    name: cloud-grafana-data
